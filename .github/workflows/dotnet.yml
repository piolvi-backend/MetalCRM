name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore MetalCRM.sln

    - name: Build
      run: dotnet build MetalCRM.sln --no-restore --configuration Release

    - name: Test
      run: dotnet test MetalCRM.sln --no-build --verbosity normal